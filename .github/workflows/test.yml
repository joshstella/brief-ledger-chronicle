name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh reports its own version via `git describe --tags --always`, which
      # needs tags to resolve to anything but a short SHA. Cheap, and it keeps the
      # log entries CI produces the same shape as a developer's.
      - name: Fetch tags
        run: git fetch --tags --force || true

      - name: Syntax check
        run: bash -n install.sh

      - name: Run tests
        run: bash tests/run.sh

      # tests/run.sh proves the validator behaves correctly against fixtures. It does not
      # prove this repository obeys the Contract it publishes — a distinct claim, and the
      # one a consumer is entitled to assume. Exits 1 on any [defect].
      - name: Check this repo against the briefs Contract
        run: bash tools/validate-briefs.sh docs/briefs
