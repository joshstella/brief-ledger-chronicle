name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh reports its own version via `git describe --tags --always`, which
      # needs tags to resolve to anything but a short SHA. Cheap, and it keeps the
      # log entries CI produces the same shape as a developer's.
      - name: Fetch tags
        run: git fetch --tags --force || true

      - name: Syntax check
        run: bash -n install.sh

      # The suite is a matrix: it runs once per awk implementation it finds and names the ones
      # it does not. ubuntu-latest already carries gawk, mawk and busybox; original-awk is the
      # one true awk and is the only candidate that needs installing. Without this step CI
      # reports "not found: original-awk" and passes, which is honest and is not coverage —
      # and Contract criterion 1 says the claimed set may not shrink to what already runs.
      - name: Install the declared awk matrix
        run: sudo apt-get update && sudo apt-get install -y original-awk

      # Records the plan in the log before the suite runs, so a build that covered less than
      # the claim says which interpreter it lost and does not have to be re-read from the
      # summary at the end. This step does not gate: a missing candidate is reported by the
      # run itself, and a runner image dropping an awk is a fact to see rather than a build
      # to stop.
      - name: Show the matrix
        run: bash tests/run.sh --matrix-plan

      - name: Run tests
        run: bash tests/run.sh

      # tests/run.sh proves the validator behaves correctly against fixtures. It does not
      # prove this repository obeys the Contract it publishes — a distinct claim, and the
      # one a consumer is entitled to assume. Exits 1 on any [defect].
      - name: Check this repo against the briefs Contract
        run: bash tools/validate-briefs.sh docs/blc/briefs
